name: clearnotes

services:
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  transcription:
    build:
      context: ../../transcription-service
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-2}
      MAX_AUDIO_BYTES: 104857600
      HF_HOME: /models/cache
    volumes:
      - whisper_model_cache:/models/cache
    networks:
      - private
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 15m
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - private
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      SPRING_APPLICATION_NAME: clearnotes-backend
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      UPLOAD_DIR: /data/clearnotes/uploads
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      TRANSCRIPTION_BASE_URL: http://transcription:8000
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx2g
    volumes:
      - audio_files:/data/clearnotes/uploads
    networks:
      - private
    depends_on:
      mysql:
        condition: service_healthy
      transcription:
        condition: service_healthy
      ollama:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - private
    depends_on:
      - backend

volumes:
  mysql_data:
  audio_files:
  whisper_model_cache:
  ollama_models:
  caddy_data:
  caddy_config:

networks:
  private:
    driver: bridge
