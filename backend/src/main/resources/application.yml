server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/clearnotes}
    username: ${SPRING_DATASOURCE_USERNAME:clearnotes}
    password: ${SPRING_DATASOURCE_PASSWORD:clearnotes_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

clearnotes:
  storage:
    upload-dir: ${UPLOAD_DIR:/data/clearnotes/uploads}
  upload:
    max-bytes: 104857600
  jwt:
    secret: ${JWT_SECRET}
    issuer: clearnotes
    access-token-ttl-seconds: 3600
  transcription:
    base-url: ${TRANSCRIPTION_BASE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
