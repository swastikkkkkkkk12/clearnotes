server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/clearnotes}
    username: ${SPRING_DATASOURCE_USERNAME:clearnotes}
    password: ${SPRING_DATASOURCE_PASSWORD:clearnotes_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
