services:
  db:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-clearnotes}
      MYSQL_USER: ${MYSQL_USER:-clearnotes}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-clearnotes_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_APPLICATION_NAME: clearnotes-backend
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/${MYSQL_DATABASE:-clearnotes}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-clearnotes}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-clearnotes_dev_password}
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env using the instructions in .env.example}"
      UPLOAD_DIR: /data/clearnotes/uploads
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      TRANSCRIPTION_BASE_URL: http://transcription-service:8000
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    volumes:
      - clearnotes_uploads:/data/clearnotes/uploads
    depends_on:
      db:
        condition: service_healthy
      transcription-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:${BACKEND_PORT:-8080}"
    depends_on:
      - backend

  transcription-service:
    build: ./transcription-service
    ports:
      - "127.0.0.1:${TRANSCRIPTION_PORT:-8000}:8000"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
      MAX_AUDIO_BYTES: 104857600
      HF_HOME: /models/cache
    volumes:
      - whisper_model_cache:/models/cache
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  mysql_data:
  clearnotes_uploads:
  whisper_model_cache:
